<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de Residuos Peligrosos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lateral nav fija + área de trabajo; en móvil la nav pasa a barra superior con scroll horizontal.
   Color: tintas verde-gris de campo, acento verde bosque; rojo/ámbar/verde solo para estado y riesgo.
   Tipo: Barlow Condensed (títulos y cifras), IBM Plex Sans (texto), IBM Plex Mono (datos y códigos). */
:root{
  --bg:#e9ede8; --surface:#f8faf6; --surface2:#eef2ec; --ink:#16201b; --muted:#566259; --line:#d0d8cf;
  --accent:#175c49; --accent-ink:#ffffff; --accent-soft:#d6e8df;
  --ok:#1f7a45; --ok-bg:#d8eddd; --warn:#8a5a00; --warn-bg:#f6e3b4; --bad:#a52a22; --bad-bg:#f5d3cf;
  --side:#13201a; --side-ink:#dbe6df; --side-muted:#8ea396; --side-active:#22392f;
  --shadow:0 1px 2px rgba(20,32,26,.08);
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211d; --surface2:#1f2a25; --ink:#e4ebe6; --muted:#97a69c; --line:#2b3932;
  --accent:#5cc6a2; --accent-ink:#08150f; --accent-soft:#1f3a30;
  --ok:#6fd08f; --ok-bg:#1c3a27; --warn:#e8b95a; --warn-bg:#3d3216; --bad:#f08b82; --bad-bg:#442220;
  --side:#0a100d; --side-ink:#dbe6df; --side-muted:#7f9488; --side-active:#1a2a22; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211d; --surface2:#1f2a25; --ink:#e4ebe6; --muted:#97a69c; --line:#2b3932;
  --accent:#5cc6a2; --accent-ink:#08150f; --accent-soft:#1f3a30;
  --ok:#6fd08f; --ok-bg:#1c3a27; --warn:#e8b95a; --warn-bg:#3d3216; --bad:#f08b82; --bad-bg:#442220;
  --side:#0a100d; --side-ink:#dbe6df; --side-muted:#7f9488; --side-active:#1a2a22; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-block:0;padding-left:0;padding-right:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand svg{flex:none}
.brand b{font:700 20px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;color:var(--side-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:6px;padding:10px 10px;color:var(--side-ink);cursor:pointer;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--side-muted)}
.sync{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 8px;display:flex;gap:8px;align-items:flex-start}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--side-muted);margin-top:5px;flex:none}
.sync.on i{background:#4fd18b}
main{min-width:0;padding-block:24px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
h1{font:700 32px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;min-height:28px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:36px;min-width:0}
.tools input[type=search]{flex:1 1 220px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.mut{color:var(--muted)}
.act{white-space:nowrap;text-align:right}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neu{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:4px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font:600 20px var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:14px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--accent)}
.kpi .lb{font:600 12px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .big{font:700 46px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .ft{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{padding:16px;min-width:0}
.card h2{font:600 18px var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:0 0 12px}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface2);margin:6px 0 10px}
.stack i{display:block;height:100%}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar div{height:10px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar div i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* reportes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.rep{display:flex;flex-direction:column;min-width:0}
.rep .top{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.date{flex:none;width:58px;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 0}
.date b{display:block;font:700 26px/1 var(--f-display)}
.date small{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.rep .meta{min-width:0}
.rep .meta b{display:block;overflow-wrap:anywhere}
.rep .body{padding:12px 16px;display:grid;gap:10px;flex:1}
.rep .lbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rep p{margin:2px 0 0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini{width:100%;min-width:0;font-size:12.5px}
.mini th{padding:5px 6px;font-size:10.5px}.mini td{padding:6px;border-bottom:1px solid var(--line)}
.rep .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
/* iperc */
.rk{display:inline-grid;place-items:center;min-width:34px;height:30px;border-radius:5px;font:700 16px var(--f-display);padding:0 6px}
.rk.ok{background:var(--ok-bg);color:var(--ok)}.rk.warn{background:var(--warn-bg);color:var(--warn)}.rk.bad{background:var(--bad-bg);color:var(--bad)}
.ctl{display:flex;gap:3px}
.ctl b{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;font:600 11px var(--f-mono);background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.ctl b.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
tr.det td{background:var(--surface2)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.dgrid h4{margin:0 0 3px;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dgrid p{margin:0;overflow-wrap:anywhere}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
/* documentos */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{font-family:var(--f-mono);opacity:.75;margin-left:4px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px}
.file{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.thumb{aspect-ratio:4/3;background:var(--surface2);display:grid;place-items:center;border:0;padding:0;cursor:pointer;width:100%;border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ext{font:700 34px var(--f-display);letter-spacing:.06em;color:var(--accent)}
.file .info{padding:10px 12px;display:grid;gap:4px;min-width:0;flex:1}
.file .info b{overflow-wrap:anywhere}
.file .info p{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.file .btns{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,14,11,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);margin-block:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.sm{width:min(430px,100%)}
.modal.wide{width:min(1000px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font:700 22px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.mb{padding:18px;display:grid;gap:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);min-width:0;width:100%}
label.f textarea{min-height:76px;resize:vertical}
.sec{font:600 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px;margin:4px 0 0}
.irow{display:grid;grid-template-columns:1.3fr 1.3fr .8fr .7fr 1.3fr auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.irow label.f{font-size:10.5px}
.live{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;max-width:calc(100% - 32px)}
.prev{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:4px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;flex-direction:row;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;gap:10px}
  .brand small,.sync,.nav .n{display:none}
  .nav{flex-direction:row}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fg{grid-template-columns:minmax(0,1fr)}
  .irow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.xb{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.heatwrap{display:flex;gap:18px;flex-wrap:wrap}
.heatwrap svg{width:100%;max-width:400px;height:auto;border:1px solid var(--line);border-radius:8px}
#map{height:440px;border-radius:6px;z-index:0}
.live.full{grid-column:1/-1}
@media print{.side,.hb,.tools{display:none}.app{display:block}}
/* v3 · bitácora, fotos y anexos de reportes */
#f-bitacora{min-height:190px}
#ax-list{display:grid;gap:8px;margin-top:8px}
.axi{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.axt{width:64px;height:48px;border-radius:4px;overflow:hidden;background:var(--surface);display:grid;place-items:center}
.axt img{width:100%;height:100%;object-fit:cover;display:block}
.axt .ext{font:700 15px var(--f-display);color:var(--accent)}
.axn{display:grid;gap:3px;min-width:0}
.axn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.axn input{width:100%;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
.axg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px;margin-top:6px}
.axf{margin:0}
.axf button{border:0;padding:0;background:none;cursor:zoom-in;width:100%;display:block}
.axf img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.axf figcaption{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.axs{display:flex;gap:4px;margin:6px 0 4px}
.axs img{width:calc(25% - 3px);aspect-ratio:1;object-fit:cover;border-radius:4px;border:1px solid var(--line);min-width:0}
.axl{margin:4px 0 0;padding-left:18px}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;cursor:zoom-out}
.lbx img{max-width:100%;max-height:82vh;border-radius:4px}
.lbx p{color:#fff;margin:0;text-align:center}
/* v4 · puntos, áreas y líneas dibujados en el mapa */
.gpin{background:none;border:0}
.gpin span{display:block;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);margin:2px}
.gtip{background:rgba(255,255,255,.88);border:0;box-shadow:none;font:600 11px var(--f-body);padding:1px 5px;color:#16201b}
.gtip:before{display:none}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
.gat{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center}
.gat input{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
#g-attrs{display:grid;gap:8px;margin:6px 0}
#map.drawing,#map.drawing .leaflet-interactive,#map.drawing.leaflet-grab{cursor:crosshair!important}
/* v5 · cuadros ordenables, resúmenes y bloque SSOMA */
.tw{max-height:72vh}
.tw th{position:sticky;top:0;z-index:2}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
tbody tr:hover td{background:var(--accent-soft)}
tfoot td{position:sticky;bottom:0;z-index:2;background:var(--surface2);border-top:2px solid var(--line);font-weight:600}
.srt{cursor:pointer;user-select:none}.srt:hover{color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.mc span{font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mc b{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}.mc small{color:var(--muted);font-size:12px}
.stb{display:flex;height:10px;min-width:90px;border-radius:3px;overflow:hidden;background:var(--surface2)}.stb i{display:block;height:100%}
.srow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.srow label.f,.cl label.f{font-size:10.5px}.ssl{display:grid;gap:8px}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.bdg{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.bdg .pill{font-size:11px;padding:1px 8px}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#f0b429"/><path d="M17 6l11 19H6z" fill="none" stroke="#13201a" stroke-width="2.4" stroke-linejoin="round"/><path d="M17 13v6" stroke="#13201a" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="22" r="1.4" fill="#13201a"/></svg>
      <div><b>Residuos</b><small>Gestión de peligrosos</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
    <div class="sync" id="sync"><i></i><span>Conectando…</span></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);

let db=null,assets=null,dl=null,canWrite=true,mode='local',loaded=false;
const KEY='gestion-residuos-v1';
const IDBN='gestion-residuos-idb';
const idbOpen=()=>new Promise((ok,no)=>{const q=indexedDB.open(IDBN,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const idbPut=async v=>{const d=await idbOpen();return new Promise((ok,no)=>{const x=d.transaction('kv','readwrite');x.objectStore('kv').put(v,'S');x.oncomplete=()=>ok();x.onerror=()=>no(x.error)})};
const idbGet=async()=>{const d=await idbOpen();return new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get('S');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
var persist=()=>{let full=false;try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.removeItem(KEY+'-idb')}catch(e){full=true}
  if(full){idbPut(S).then(()=>{try{localStorage.setItem(KEY+'-idb','1')}catch(_){}}).catch(()=>toast('Sin espacio para guardar en este navegador'))}};
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old)Object.keys(S).forEach(k=>S[k]=old[k]||[])}catch(e){}
try{if(localStorage.getItem(KEY+'-idb'))idbGet().then(d=>{if(d){Object.keys(S).forEach(k=>S[k]=d[k]||[]);render()}}).catch(()=>{})}catch(e){}
const bySort=(a,b)=>(b.creado||0)-(a.creado||0);
const sorted=c=>S[c].slice().sort(bySort);
async function save(col,rec){
  const id=rec.id||newId();const data={...rec};delete data.id;if(!data.creado)data.creado=Date.now();
  if(db){await db.collection(col).doc(id).set(data)}
  else{const i=S[col].findIndex(x=>x.id===id);const r={id,...data};i<0?S[col].push(r):S[col][i]=r;persist();render()}
  return id;
}
async function remove(col,id){
  if(db){await db.collection(col).doc(id).delete()}
  else{S[col]=S[col].filter(x=>x.id!==id);persist();render()}
}
async function boot(){
  const c=window.claude;
  if(c?.use){
    try{db=await c.use('db')}catch(e){db=null}
    try{assets=await c.use('assets')}catch(e){assets=null}
    try{dl=await c.use('downloads')}catch(e){dl=null}
    try{const u=await c.use('user');if(u){const w=u.can?.('data.write');if(w===false)canWrite=false}}catch(e){}
  }
  if(db){
    mode='db';
    Object.keys(S).forEach(col=>{
      db.collection(col).onSnapshot(s=>{S[col]=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;render()},
        e=>{console.warn(col,e);if(e&&e.code==='unavailable')setSync()});
    });
  }
  setSync();render();
}
function setSync(){
  const el=$('#sync');el.className='sync'+(mode==='db'?' on':'');
  el.querySelector('span').textContent=mode==='db'?(canWrite?'Guardado privado y compartido con quienes tengan acceso':'Solo lectura'):'Datos guardados de forma permanente en este navegador · conecta una carpeta para respaldo y tiempo real';
}

  for(let p=4;p>=1;p--){o+=`<text x="${ox-8}" y="${oy+(4-p)*ch+30}" text-anchor="end" font-size="11" fill="#566259">${L.P[p-1][1].split(' · ')[1]}</text>`;
    for(let s=1;s<=3;s++){const R=p*s,c=COL[lvl(R)],x=ox+(s-1)*cw,y=oy+(4-p)*ch,n=cnt[p+'-'+s]||0;

}

   Se pega TAL CUAL justo antes de la última línea:  render();boot();
   Reutiliza save/remove/find/formGeneric/head/xbtns/XT/flyTo/outTabs ya existentes. */
const SN=['Sí','No'],SNA=['Sí','No','N/A'];
const CARGOS=['Ingeniero','Supervisor HSE','Enfermero','Capataz','Ayudante general','Motosierrista','Monitor ambiental'];
const EVE=['Pendiente','Programado','En limpieza','Limpiado','Verificado con APU'];
const addD=(d,n)=>{if(!d)return'';const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const diffD=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const pl=(t,c)=>`<span class="pill ${c||'neu'}">${esc(t)}</span>`;
const yn=v=>v==='Sí'?pl('Sí','ok'):v==='No'?pl('No','bad'):'<span class="mut">—</span>';
const sm=(rows,k)=>rows.reduce((a,r)=>a+(+r[k]||0),0);
const bsHasUtm=r=>Number(r.utmE)>0&&Number(r.utmN)>0;
const bsUtm=r=>bsHasUtm(r)?`<span class="mono">${esc(r.utmZ||'18M')}<br>E ${esc(r.utmE)}<br>N ${esc(r.utmN)}</span>`:'<span class="mut">—</span>';
const bsN=s=>String(s||'').split('\n').filter(x=>x.trim()).length;
const vig=d=>d?(d<today()?pl('Vencido '+fmtD(d),'bad'):pl('Vence '+fmtD(d),'ok')):'<span class="mut">—</span>';
const aprCls=a=>a==='Aprobado'?'ok':a==='Observado'?'warn':'neu';
const DOCP=[['titulo','Título / CV'],['antec','Antecedentes'],['djNac','DJ nacionalidad'],['djPar','DJ parentesco'],['emo','EMO / apto'],['vac','Vacunas'],['sctr','SCTR']];
const faltaP=r=>DOCP.filter(([k])=>!['Sí','N/A'].includes(r[k]));

/* plazos de cada requerimiento (TDR 5.5, 6 y 7) y penalidad estimada (S/ 200 por día de retraso) */
const bsPl=r=>({seg:[addD(r.fechaOS,4),r.seguros],plan:[addD(r.fechaOS,5),r.plan],inf:[addD(r.fechaFin,5),r.informe]});
const bsDias=([l,e])=>l?Math.max(0,diffD(l,e||today())):0;
const bsPen=r=>(bsDias(bsPl(r).plan)+bsDias(bsPl(r).inf))*200;
const bsCell=p=>{const[l,e]=p;if(!l)return'<span class="mut">—</span>';
  const b=e?(diffD(l,e)>0?pl('Entregado +'+diffD(l,e)+' d','bad'):pl('A tiempo','ok')):(diffD(l,today())>0?pl('Vencido '+diffD(l,today())+' d','bad'):pl('En plazo','neu'));
  return b+`<div class="mono mut">límite ${fmtD(l)}${e?' · entregado '+fmtD(e):''}</div>`};

   Se pega justo antes de  render();boot();  (puede ir antes o después del bloque de las Bases).
   Agrega en la Matriz IPERC los botones "Importar Excel" y "Plantilla Excel".
   Reconoce columnas por su nombre (también el Excel que exporta esta misma app), rellena celdas combinadas,
   valida P y S, evita duplicados y muestra una vista previa antes de cargar. */
const ixNorm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const ixNum=v=>{const m=String(v??'').match(/\d+(?:[.,]\d+)?/);return m?Math.round(parseFloat(m[0].replace(',','.'))):0};
const ixDate=v=>{if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
  const s=String(v??'').trim(),a=s.match(/^(\d{4})-(\d{2})-(\d{2})/),b=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(a)return a[1]+'-'+a[2]+'-'+a[3];if(b)return(b[3].length===2?'20'+b[3]:b[3])+'-'+b[2].padStart(2,'0')+'-'+b[1].padStart(2,'0');return''};
/* [campo, expresión sobre el encabezado normalizado] — el orden da prioridad */
const IXMAP=[['p2',/residual.*prob|prob.*residual|^p res/],['s2',/residual.*sever|sever.*residual|^s res/],['ctlmix',/controles a implementar|jerarquia/],
 ['detalle',/detalle|descripcion del peligro/],['dano',/dano|consecuencia/],['relacionado',/relacionad/],['controlesExistentes',/control\w* existente|existente/],
 ['eliminar',/elimin/],['sustituir',/sustit/],['ingenieria',/ingenier/],['administrativos',/administrativ/],['epp',/^epp|equipo\w* de proteccion/],
 ['rutinaria',/rutin|tipo de tarea/],['expuestos',/expuesto/],['legal',/legal/],['responsable',/responsable/],['plazo',/plazo|fecha lim/],['estadoAcc',/estado/],
 ['codigo',/^codigo|^cod$|^item|^n$|^n\s?o$/],['proceso',/proceso/],['actividad',/actividad/],['tarea',/tarea/],['zona',/zona|^area|lugar/],
 ['p',/^p$|prob/],['s',/^s$|sever/],['riesgo',/riesgo|evento peligroso/],['peligro',/peligro/]];
const IXSKIP=/nivel|aceptac|grado|valor|^r$|^r res|clasificacion del riesgo/;
function ixMapHeader(row){const col={};row.forEach((h,i)=>{const n=ixNorm(h);if(!n||IXSKIP.test(n))return;
  for(const[k,re]of IXMAP){if(col[k]===undefined&&re.test(n)){col[k]=i;break}}});return col}
function ixParse(aoa,existing){
  let best=-1,bc={},bn=0;
  for(let i=0;i<Math.min(aoa.length,25);i++){const c=ixMapHeader(aoa[i]),n=Object.keys(c).length;if(n>bn&&(c.actividad!==undefined||c.peligro!==undefined||c.riesgo!==undefined)){best=i;bc=c;bn=n}}
  if(best<0||bn<3)return{error:'No encontré los encabezados. Usa la plantilla: necesito al menos Actividad, Peligro, Riesgo, P y S.'};
  const g=(r,k)=>bc[k]===undefined?'':r[bc[k]],T=(r,k)=>String(g(r,k)??'').trim(),keep={},warn=[],rows=[],seen=new Set((existing||[]).map(x=>ixNorm([x.actividad,x.tarea,x.peligro,x.detalle,x.riesgo].join('|'))));
  let dup=0,vac=0,fuera=0,sinPS=0;
  for(let i=best+1;i<aoa.length;i++){const r=aoa[i];if(!r||r.every(c=>String(c??'').trim()===''))continue;
    const hadAct=T(r,'actividad');['actividad','tarea','zona','proceso'].forEach(k=>{const v=T(r,k);if(v)keep[k]=v});
    let act=hadAct,tar=T(r,'tarea')||(hadAct?'':keep.tarea||'');if(bc.tarea===undefined&&/\s\/\s/.test(act)){const q=act.split(/\s\/\s/);act=q[0];tar=q.slice(1).join(' / ')}
    const ph=T(r,'peligro'),det=T(r,'detalle'),rie=T(r,'riesgo');
    if(!act&&!ph&&!rie){vac++;continue}
    const o={actividad:act||keep.actividad||'',tarea:tar,zona:T(r,'zona')||keep.zona||'',codigo:T(r,'codigo'),proceso:T(r,'proceso')||keep.proceso||'',
      detalle:det,riesgo:rie,dano:T(r,'dano'),controlesExistentes:T(r,'controlesExistentes'),eliminar:T(r,'eliminar'),sustituir:T(r,'sustituir'),ingenieria:T(r,'ingenieria'),administrativos:T(r,'administrativos'),epp:T(r,'epp'),
      expuestos:ixNum(g(r,'expuestos'))||'',legal:T(r,'legal'),responsable:T(r,'responsable'),plazo:ixDate(g(r,'plazo')),estadoAcc:'',rutinaria:''};
    const pn=ixNorm(ph),pm=L.peligro.find(x=>ixNorm(x)===pn||(pn.length>=4&&ixNorm(x).startsWith(pn.slice(0,4))));o.peligro=pm||'OTROS';if(!pm&&ph&&!o.detalle)o.detalle=ph;
    const rn=ixNorm(T(r,'relacionado')),rm=L.rel.find(x=>ixNorm(x)===rn||(rn.length>=5&&ixNorm(x).startsWith(rn.slice(0,5))));o.relacionado=rm||'';
    const ru=ixNorm(T(r,'rutinaria'));o.rutinaria=/^no/.test(ru)?'No rutinaria':ru?'Rutinaria':'';
    const ea=ixNorm(T(r,'estadoAcc'));o.estadoAcc=/ejec|proceso/.test(ea)?'En ejecución':/implem|cerr|ejecutado/.test(ea)?'Implementado':ea?'Pendiente':'';
    if(bc.ctlmix!==undefined){String(T(r,'ctlmix')).split(/\n/).forEach(l=>{const m=l.match(/^\s*([A-E])\s+[^:]+:\s*(.+)$/i);if(m){const k={A:'eliminar',B:'sustituir',C:'ingenieria',D:'administrativos',E:'epp'}[m[1].toUpperCase()];if(!o[k])o[k]=m[2].trim()}})}
    let p=ixNum(g(r,'p')),s=ixNum(g(r,'s'));
    if(!p||!s){sinPS++;p=p||1;s=s||1}
    if(p>4||s>3){fuera++;p=Math.min(p,4);s=Math.min(s,3)}
    o.p=p;o.s=s;
    const p2=ixNum(g(r,'p2')),s2=ixNum(g(r,'s2'));o.p2=p2&&s2?Math.min(p2,4):'';o.s2=p2&&s2?Math.min(s2,3):'';
    const key=ixNorm([o.actividad,o.tarea,o.peligro,o.detalle,o.riesgo].join('|'));
    if(seen.has(key)){dup++;continue}seen.add(key);rows.push(o)}
  if(sinPS)warn.push(sinPS+' fila(s) sin P o S válidos: se asumió 1.');
  if(fuera)warn.push(fuera+' fila(s) con P > 4 o S > 3: se ajustaron al máximo de la escala de esta matriz (P 1–4, S 1–3). Revísalas.');
  if(dup)warn.push(dup+' fila(s) ya existían (misma actividad, peligro y riesgo): se omitieron.');
  if(!rows.length)return{error:'No hay filas nuevas para importar.',warn};
  return{rows,warn,cols:Object.keys(bc),fila:best+1}}

const JSZ='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const kmlFile=()=>{let f=$('#kml-file');if(!f){f=document.createElement('input');f.type='file';f.id='kml-file';f.multiple=true;f.accept='.kml,.kmz';f.style.display='none';document.body.appendChild(f)}return f};
const kmlColor=c=>{c=String(c||'').trim();return/^[0-9a-f]{8}$/i.test(c)?'#'+c.slice(6,8)+c.slice(4,6)+c.slice(2,4):''};
function kmlParse(txt){const d=new DOMParser().parseFromString(txt,'text/xml');if(d.querySelector('parsererror'))throw new Error('el KML no es válido');
  const q=(n,t)=>[...n.children].find(c=>c.localName===t),tx=(n,t)=>{const c=q(n,t);return c?c.textContent.trim():''},col={};
  d.querySelectorAll('Style').forEach(st=>{const id=st.getAttribute('id');const c=['PolyStyle','LineStyle','IconStyle'].map(t=>q(st,t)).filter(Boolean).map(x=>kmlColor(tx(x,'color'))).find(Boolean);if(id&&c)col['#'+id]=c});
  d.querySelectorAll('StyleMap').forEach(sm=>{[...sm.children].forEach(p=>{if(tx(p,'key')==='normal'&&col[tx(p,'styleUrl')])col['#'+sm.getAttribute('id')]=col[tx(p,'styleUrl')]})});
  const cc=s=>s.trim().split(/\s+/).map(t=>t.split(',').map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])).map(a=>[+a[1].toFixed(6),+a[0].toFixed(6)]),out=[];
  d.querySelectorAll('Placemark').forEach(pm=>{const nombre=tx(pm,'name')||'Sin nombre',desc=tx(pm,'description').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
    let fo='',n=pm.parentNode;while(n&&n.localName&&!fo){if(n.localName==='Folder'||n.localName==='Document')fo=tx(n,'name');n=n.parentNode}
    const inl=q(pm,'Style'),c=col[tx(pm,'styleUrl')]||(inl&&['PolyStyle','LineStyle','IconStyle'].map(t=>q(inl,t)).filter(Boolean).map(x=>kmlColor(tx(x,'color'))).find(Boolean))||'#2563eb';
    const attrs=[...pm.querySelectorAll('Data,SimpleData')].map(x=>({k:x.getAttribute('name')||'',v:(x.localName==='Data'?tx(x,'value'):x.textContent).trim()})).filter(a=>a.k&&a.v);
    const add=(tipo,coords)=>{if(coords.length)out.push({tipo,nombre,categoria:fo||'Importado KML',color:c,descripcion:desc,attrs,coords})};
    pm.querySelectorAll('Point').forEach(g=>add('punto',cc(g.querySelector('coordinates')?.textContent||'').slice(0,1)));
    pm.querySelectorAll('LineString').forEach(g=>add('linea',cc(g.querySelector('coordinates')?.textContent||'')));
    pm.querySelectorAll('Polygon').forEach(g=>{let v=cc((g.querySelector('outerBoundaryIs coordinates')||g.querySelector('coordinates'))?.textContent||'');if(v.length>3&&v[0][0]===v[v.length-1][0]&&v[0][1]===v[v.length-1][1])v.pop();add('area',v)})});
  return out}
async function kmlImport(files){let n=0;toast('Leyendo KML…');
  try{for(const f of files){let t;if(/\.kmz$/i.test(f.name)){await loadJS(JSZ);const z=await window.JSZip.loadAsync(await f.arrayBuffer()),e=z.file('doc.kml')||Object.values(z.files).find(x=>/\.kml$/i.test(x.name));if(!e)throw new Error('el KMZ no contiene un archivo .kml');t=await e.async('string')}else t=await f.text();
      const rows=kmlParse(t);if(LOCAL)await saveMany('geo',rows);else for(const r of rows)await save('geo',r);n+=rows.length}
    toast(n?n+' elemento'+(n>1?'s':'')+' importado'+(n>1?'s':'')+' al mapa':'No encontré puntos, líneas ni áreas en el archivo')}catch(e){toast('No se pudo importar: '+(e&&e.message||'revisa el archivo o tu conexión'))}}

const sig=l=>l==='Aceptable'||l==='Moderado'?'No':'Si';
const calc=r=>{const sv=+r.sev||0,Z=prob(r.v1,r.v2,r.v3,r.v4),AB=Z*sv,AC=niv(AB),AN=prob(r.w1,r.w2,r.w3,r.w4),AP=AN*sv,AQ=niv(AP);

.ipx-sum{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.ipx-leg{margin:0 0 12px;font-size:13px;color:var(--muted)}

.ipx-img{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ipx-img img{max-height:54px;max-width:160px;border:1px solid var(--line);background:#fff;border-radius:4px}
`;

/* ---------- hoja HTML ---------- */
const nx=v=>v===undefined||v===null?'':v;
function sheet(m,rows,edit){
  const cols=W.map(w=>`<col style="width:${px(w)}px">`).join('');
  const total=W.reduce((a,w)=>a+px(w),0);
  const rp=runs(rows,r=>r.proceso),rs=runs(rows,r=>r.proceso+SEP+r.subproceso),ra=runs(rows,r=>r.proceso+SEP+r.subproceso+SEP+r.actividad);
  const logo=m.logo||SEED.logo;
  const th=h=>`<th colspan="${h.n||1}" rowspan="${h.rs||1}" style="${h.f?`background:#${h.f}`:'background:#fff'}">${h.rot?`<div class="rt">${esc(h.t)}</div>`:esc(h.t)}</th>`;
  const head=`<tr class="t1"><td colspan="40"><img class="lg" src="${esc(logo)}" alt=""><div>${esc(m.empresa)}</div></td><td colspan="4" class="cb">Codigo: ${esc(m.codigo)}\nRev: ${esc(m.rev)}\nFecha: ${esc(m.fecha)}</td></tr>
  <tr class="t2"><td colspan="40">${esc(m.titulo)}</td><td colspan="4" class="v">Versión: ${esc(m.version)}</td></tr>
  <tr class="t3"><td colspan="44">Proyecto: ${esc(m.proyecto)}</td></tr><tr class="t3"><td colspan="44">Elaborado: ${esc(m.elaborado)}</td></tr>
  <tr class="t3"><td colspan="44">Revisado:  ${esc(m.revisado)}</td></tr><tr class="t3"><td colspan="44">Aprobado: ${esc(m.aprobado)}</td></tr><tr class="t3"><td colspan="44"></td></tr>
  <tr class="r8">${H8.map(th).join('')}</tr><tr class="r9">${H9.map(h=>th({...h,n:1,rs:1})).join('')}</tr>`;
  let n=0;
  const body=rows.map((r,i)=>{
    if(ra[i])n++;const c=calc(r),x=v=>v?'x':'',t=(v,cls='')=>`<td class="${cls}">${esc(nx(v))}</td>`,lv=(l)=>`<td style="background:#${LVC[l]}"><b>${l}</b></td>`;
    return `<tr class="d" ${edit?`data-ipx="row:${r.id}" title="Clic para editar esta fila"`:''}>
    ${ra[i]?`<td rowspan="${ra[i]}" style="background:#ececec;font-weight:700">${n}</td>`:''}
    ${rp[i]?`<td rowspan="${rp[i]}" style="background:#ffff00">${esc(r.proceso)}</td>`:''}
    ${rs[i]?`<td rowspan="${rs[i]}">${esc(r.subproceso)}</td>`:''}
    ${ra[i]?`<td rowspan="${ra[i]}" colspan="2">${esc(r.actividad)}</td>`:''}
    ${t(r.peligro)}${t(r.evento)}${t(r.lesion)}${t(x(r.rut),'xc')}${t(x(r.nor))}${t(x(r.eme))}${t(x(r.dentro))}${t(x(r.fuera))}${t(x(r.propio))}${t(x(r.terc))}
    ${t(r.cEli)}${t(r.cSus)}${t(r.cIng)}${t(r.cAdm,'l')}${t(r.cEpp)}${t(r.cU)}
    ${t(r.v1)}${t(r.v2)}${t(r.v3)}${t(r.v4)}${t(c.Z,'pr')}${t(c.sv)}${t(c.AB,'pr')}${lv(c.AC)}${t(c.AD)}
    ${t(r.aEli)}${t(r.aSus)}${t(r.aIng)}${t(r.aAdm,'l')}${t(r.aEpp)}
    ${t(r.w1)}${t(r.w2)}${t(r.w3)}${t(r.w4)}${t(c.AN,'pr')}${t(c.sv)}${t(c.AP,'pr')}${lv(c.AQ)}${t(c.AR)}</tr>`}).join('');
  const sg=(img,d,lab)=>`<tr class="f3"><td class="nb"></td><td colspan="5" class="ft cb" style="vertical-align:middle;text-align:center">${lab}</td><td colspan="2" class="ft" style="font-weight:700">FIRMA</td><td colspan="7" class="ft">${img?`<img class="sg" src="${esc(img)}" alt="">`:''}</td><td colspan="5" class="ft"></td><td class="ft" style="font-weight:700">FECHA</td><td colspan="9" class="ft">${esc(dmy(d))}</td></tr>`;
  const foot=`<tr><td colspan="44" class="nb" style="height:21px"></td></tr>
  <tr class="f1"><td class="nb"></td><td colspan="25" class="ft g">${esc(m.titulo)}</td><td colspan="4" class="ft">Versión: ${esc(m.version)}</td></tr>
  <tr class="f2"><td class="nb"></td><td colspan="29" class="ft l" style="text-align:left">Proyecto: ${esc(m.proyecto)}</td></tr>
  ${sg(m.sigE,m.fEla,'Elaborado: ')}${sg(m.sigR,m.fRev,'Revisado')}${sg(m.sigA,m.fApr,'Aprobado')}`;
  return `<table class="ipx" style="width:${total}px"><colgroup>${cols}</colgroup><tbody>${head}${body}${foot}</tbody></table>`;
}

/* ---------- vista ---------- */
let _old=null;
function seedMaybe(){
  if(S.ipercm.some(m=>m.id===SEED.id)||S.ipercm.length)return;
  let fl=false;try{fl=localStorage.getItem('ipx-seeded')}catch(e){}
  if(fl||(mode==='db'&&!loaded))return;
  store('ipx-seeded','1');setTimeout(()=>loadSeed(true),0);
}
async function loadSeed(quiet){
  try{
    if(db){const g=await db.collection('ipercm').doc(SEED.id).get();if(g&&g.exists){if(!quiet)toast('Ya existe');return}}
    else if(S.ipercm.some(m=>m.id===SEED.id)){if(!quiet)toast('Ya existe');return}
    const{filas,...m}=SEED;await save('ipercm',{...m,creado:1});
    let i=0;for(const r of filas)await save('ipercf',{...r,id:'ipx-pd-'+r.id,mid:m.id,orden:++i,creado:i+1});
    if(!quiet)toast('Primer despacho cargado');
  }catch(e){console.warn(e)}
}
const btn=(a,t,c='',ttl='')=>`<button class="btn sm ${c}" data-ipx="${a}" ${ttl?`title="${esc(ttl)}"`:''}>${t}</button>`;
function vIpx(){
  seedMaybe();
  const list=mats(),m=isLegacy()?null:cur();
  if(m&&IPX.sel!==m.id){IPX.sel=m.id}
  const rows=m?rowsOf(m.id):[];
  const cs=rows.map(calc),ns=cs.filter(c=>c.AD==='Si').length,nr=cs.filter(c=>c.AR==='Si').length;
  const tabs=`<div class="ipx-tabs" role="group" aria-label="Matrices IPERC">${list.map(x=>`<button class="ipx-tab" data-ipx="sel:${x.id}" aria-pressed="${m&&x.id===m.id}">${esc(x.nombre||'Sin nombre')}<small>${S.ipercf.filter(r=>r.mid===x.id).length}</small></button>`).join('')}
    ${LEG()?`<button class="ipx-tab" data-ipx="sel:__old" aria-pressed="${isLegacy()?'true':'false'}" title="Registros del formato anterior de esta aplicación">Matriz anterior<small>${S.iperc.length}</small></button>`:''}
    ${canWrite?`<button class="btn sm pri" data-ipx="newm">+ Nueva matriz</button>`:''}</div>`;
  const top=`<div class="head"><div><h1>Matriz IPERC</h1><p class="sub">Una matriz por despacho, con el mismo formato del Excel (ECCAN-SSMA-IPRC-01). Cada matriz es independiente: sus filas, firmas y fechas no se mezclan con las de otra.</p></div>
    <div class="ipx-hb">${canWrite?btn('imp','Importar Excel','','Cargar una matriz desde un Excel con este mismo formato'):''}${list.length>1?btn('xall','Excel de todas','','Un solo libro con una hoja por matriz'):''}</div></div>`;
  if(isLegacy())return top+tabs+`<div class="panel card" style="margin-bottom:14px"><b>Matriz anterior</b><p class="mut" style="margin:4px 0 0">Registros hechos con el formato anterior de la aplicación. Se conservan sin cambios; las matrices nuevas usan el formato del Excel.</p></div>`+_old();
  if(!m)return top+tabs+`<div class="panel">${emptyBox('Aún no hay matrices','Crea la matriz de un despacho, importa tu Excel IPERC o carga la matriz del Primer despacho.',`<button class="btn pri" data-ipx="newm">+ Nueva matriz</button> <button class="btn" data-ipx="imp">Importar Excel</button> <button class="btn" data-ipx="seed">Cargar Primer despacho (Excel original)</button>`)}</div>`;
  const edit=canWrite;
  return top+tabs+`
  <div class="ipx-bar"><b style="font:600 18px var(--f-display);letter-spacing:.04em">${esc(m.nombre)}</b><span class="mut mono">${esc(m.codigo)} · Rev ${esc(m.rev)} · ${esc(m.fecha)}</span><span class="sp"></span>
    ${edit?btn('addrow','+ Agregar fila','pri'):''}${edit?btn('editm','Cabecera y firmas'):''}${btn('xls','Descargar Excel','','Mismo formato del Excel, con fórmulas')}${btn('prn','Imprimir')}${edit?btn('dup','Duplicar matriz'):''}${edit?btn('delm','Eliminar matriz','danger'):''}
    <span class="ipx-zoom">${btn('zo','−')}<span>${Math.round(IPX.z*100)}%</span>${btn('zi','+')}</span></div>
  <div class="ipx-sum"><span class="pill neu">${rows.length} peligro${rows.length===1?'':'s'}</span><span class="pill ${ns?'bad':'ok'}">${ns} significativo${ns===1?'':'s'} (inicial)</span><span class="pill ${nr?'bad':'ok'}">${nr} significativo${nr===1?'':'s'} (residual)</span>
    ${edit&&rows.length?'<span class="mut" style="font-size:13px">Clic en una fila para editarla</span>':''}</div>
  <details class="ipx-leg"><summary>Criterios de cálculo (iguales al Excel)</summary><div><b>Valor de probabilidad</b> = según la suma de los 4 índices: ≤7 → 1 · 8–10 → 2 · 11–13 → 3 · 14–16 → 4 · &gt;16 → 5.<br><b>Nivel de riesgo</b> = probabilidad × severidad: ≤3 <b style="background:#00b050;color:#000;padding:0 6px">Aceptable</b> · 4–10 <b style="background:#ff0;color:#000;padding:0 6px">Moderado</b> · 11–50 <b style="background:#f4b183;color:#000;padding:0 6px">Importante</b> · &gt;50 <b style="background:#f00;color:#000;padding:0 6px">Inaceptable</b>.<br><b>Riesgo significativo</b> = “Si” cuando el nivel es Importante o Inaceptable. La severidad residual es la misma que la inicial.</div></details>
  <div class="ipx-wrap" id="ipx-wrap"><div style="zoom:${IPX.z}">${sheet(m,rows,edit)}</div></div>
  ${rows.length?'':`<div class="panel" style="margin-top:12px">${emptyBox('La matriz está vacía','Agrega el primer peligro de este despacho.',`<button class="btn pri" data-ipx="addrow">+ Agregar fila</button>`)}</div>`}`;
}

/* ---------- formularios ---------- */
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const ck=id=>{const e=document.getElementById(id);return !!(e&&e.checked)};
const imgField=(k,l,cur,maxw)=>`<div class="f full"><span style="font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)">${l}</span><div class="ipx-img"><img id="ipxp-${k}" alt="" ${cur?`src="${esc(cur)}"`:'hidden'}><input type="file" accept="image/*" data-ipxf="${k}" data-w="${maxw}"><button type="button" class="btn sm" data-ipx="rmimg:${k}">Quitar</button></div></div>`;
function readImg(file,maxw,type){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxw/im.width),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
  const x=c.getContext('2d');if(type==='jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/'+type,.85))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}

function formMat(id){
  const ex=id?S.ipercm.find(x=>x.id===id):null,base=cur()||{};
  const v=ex||{nombre:'',empresa:base.empresa||SEED.empresa,titulo:base.titulo||SEED.titulo,proyecto:base.proyecto||SEED.proyecto,codigo:base.codigo||SEED.codigo,rev:base.rev||'0',fecha:'',version:base.version||'01',
    elaborado:base.elaborado||'',revisado:base.revisado||'',aprobado:base.aprobado||'',fEla:'',fRev:'',fApr:'',logo:base.logo||'',sigE:'',sigR:'',sigA:''};
  IPX.pend={logo:v.logo||'',sigE:v.sigE||'',sigR:v.sigR||'',sigA:v.sigA||''};
  const F=(k,l,full,type)=>`<label class="f ${full?'full':''}">${l}<input id="m-${k}" type="${type||'text'}" value="${esc(v[k]||'')}"></label>`;
  modal(ex?'Cabecera y firmas':'Nueva matriz IPERC',`<form id="ipx-frm" novalidate><div class="mb"><div class="fg">
    <div class="sec full">Identificación</div>
    ${F('nombre','Nombre de la matriz (ej. Primer despacho)',1)}
    ${ex?'':`<label class="f full">Partir de<select id="m-base"><option value="">Matriz en blanco (conserva la cabecera de la actual)</option>${mats().map(x=>`<option value="${x.id}">Copiar las filas de: ${esc(x.nombre)}</option>`).join('')}</select></label>`}
    <div class="sec full">Cabecera del formato</div>
    ${F('empresa','Empresa',1)}${F('titulo','Título de la matriz',1)}${F('proyecto','Proyecto',1)}
    ${F('codigo','Código')}${F('rev','Revisión (Rev)')}${F('fecha','Fecha (texto, ej. 25/09/26)')}${F('version','Versión')}
    <div class="sec full">Elaboración, revisión y aprobación</div>
    ${F('elaborado','Elaborado por')}${F('fEla','Fecha de elaboración',0,'date')}${F('revisado','Revisado por')}${F('fRev','Fecha de revisión',0,'date')}${F('aprobado','Aprobado por')}${F('fApr','Fecha de aprobación',0,'date')}
    <div class="sec full">Logo y firmas (imágenes)</div>
    ${imgField('logo','Logo (cabecera)',v.logo||SEED.logo,500)}${imgField('sigE','Firma · Elaborado',v.sigE,300)}${imgField('sigR','Firma · Revisado',v.sigR,300)}${imgField('sigA','Firma · Aprobado',v.sigA,300)}
    </div></div><div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">${ex?'Guardar':'Crear matriz'}</button></div></form>`,'','wide');
  document.getElementById('ipx-frm').onsubmit=async e=>{e.preventDefault();
    if(!val('m-nombre')){toast('Escribe el nombre de la matriz');return}
    const rec={...(ex||{})};['nombre','empresa','titulo','proyecto','codigo','rev','fecha','version','elaborado','revisado','aprobado','fEla','fRev','fApr'].forEach(k=>rec[k]=val('m-'+k));
    ['logo','sigE','sigR','sigA'].forEach(k=>rec[k]=IPX.pend[k]||'');
    try{
      const mid=await save('ipercm',rec);IPX.sel=mid;store('ipx-sel',mid);
      const b=!ex&&document.getElementById('m-base')?document.getElementById('m-base').value:'';
      if(b){let i=0;for(const r of rowsOf(b)){const{id,mid:_m,...c}=r;await save('ipercf',{...c,mid,orden:++i})}}
      close();toast(ex?'Cabecera guardada':'Matriz creada');if(!db)render()
    }catch(err){toast('No se pudo guardar')}};
}

const SV=[1,2,3,4,5];

  const v=ex||blankRow(last||{});

  const A=(k,l,full=1)=>`<label class="f ${full?'full':''}">${l}<textarea id="r-${k}" style="min-height:64px">${esc(nx(v[k]))}</textarea></label>`;

  const N=(k,l)=>`<label class="f">${l}<select id="r-${k}">${SV.map(o=>`<option ${+v[k]===o?'selected':''}>${o}</option>`).join('')}</select></label>`;

    ${T('proceso','Proceso',0,1)}${T('subproceso','Subproceso',0,1)}${T('actividad','Actividad',1,1)}${T('peligro','Peligro (fuente, situación, acto)',1)}
    <div class="sec full">Descripción del riesgo</div>
    ${A('evento','Descripción del evento, situación peligrosa')}${A('lesion','Descripción de la lesión o enfermedad prevista')}
    <div class="sec full">Condición · ubicación · procedencia</div>
    <div class="full" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px">${C('rut','Rutinario (Normal)')}${C('nor','No rutinario (Anormal)')}${C('eme','Emergencia')}${C('dentro','Dentro del lugar de trabajo')}${C('fuera','Fuera del lugar de trabajo')}${C('propio','Personal propio')}${C('terc','Personal de terceros')}</div>
    <div class="sec full">Controles actuales (existentes)</div>
    ${T('cEli','Eliminación')}${T('cSus','Sustitución')}${T('cIng','Ingeniería')}${A('cAdm','Administrativos',0)}${A('cEpp','EPP',0)}${A('cU','Controles actuales — columna adicional (opcional)')}
    <div class="sec full">Evaluación del riesgo (inicial)</div>
    ${N('v1',T_EXI)}${N('v2',T_FRE)}${N('v3',T_PRO)}${N('v4',T_CAP)}${N('sev','Valor severidad')}
    <div class="full ipx-prev" id="ipx-pv1"></div>
    <div class="sec full">Controles adicionales (propuestos)</div>
    ${T('aEli','Eliminación')}${T('aSus','Sustitución')}${T('aIng','Ingeniería')}${A('aAdm','Administrativos',0)}${A('aEpp','EPP',0)}
    <div class="sec full">Evaluación del riesgo (residual · misma severidad)</div>
    ${N('w1',T_EXI)}${N('w2',T_FRE)}${N('w3',T_PRO)}${N('w4',T_CAP)}
    <div class="full ipx-prev" id="ipx-pv2"></div></div>${dl('proceso')}${dl('subproceso')}${dl('actividad')}`;
  modal(ex?'Editar peligro':'Agregar peligro',`<form id="ipx-frm" novalidate data-mid="${mid}"><div class="mb">${body}</div><div class="mf">

function parseSheet(X,ws,sname){

  const g=(r,c)=>{const v=a[r]&&a[r][c];if(v!==''&&v!==undefined)return v;const m=mg.find(m=>r>=m.s.r&&r<=m.e.r&&c>=m.s.c&&c<=m.e.c);return m&&a[m.s.r]?a[m.s.r][m.s.c]:''};

    codigo:rx(box,/Codigo:\s*(.*)/i)||SEED.codigo,rev:rx(box,/Rev:\s*(.*)/i),fecha:rx(box,/Fecha:\s*(.*)/i),version:rx(cell(1,40),/Versi[oó]n:\s*(.*)/i)||'01',
    proyecto:rx(cell(2,0),/Proyecto:\s*([\s\S]*)/i),elaborado:rx(cell(3,0),/Elaborado:\s*(.*)/i),revisado:rx(cell(4,0),/Revisado:\s*(.*)/i),aprobado:rx(cell(5,0),/Aprobado:\s*(.*)/i),fEla:'',fRev:'',fApr:'',logo:'',sigE:'',sigR:'',sigA:''};

/* ---------- v14b · mapa de calor y riesgo por zona alimentados por la matriz del despacho seleccionada ---------- */
const HCOL={Aceptable:['#d8eddd','#1f7a45'],Moderado:['#fbf3b0','#7a6a00'],Importante:['#f9d3b5','#a14a0a'],Inaceptable:['#f5c6c2','#a52a22']};
const ipxActive=()=>{try{return view==='ipe'&&!isLegacy()&&cur()}catch(e){return null}};
function heatIpx(kind,rows){
  const cnt={};rows.forEach(r=>{const c=calc(r),p=kind==='r'?c.AN:c.Z;if(p&&c.sv){const k=p+'-'+c.sv;cnt[k]=(cnt[k]||0)+1}});
  const cw=72,ch=50,ox=64,oy=44,W=ox+cw*5+10,H=oy+ch*5+48;
  let o=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Arial,sans-serif"><rect width="${W}" height="${H}" fill="#fff" rx="8"/><text x="12" y="22" font-size="14" font-weight="bold" fill="#16201b">${kind==='r'?'Riesgo residual (tras controles)':'Riesgo inicial'}</text><text x="${ox-8}" y="${oy-8}" text-anchor="end" font-size="10" font-weight="bold" fill="#16201b">PROBABILIDAD</text>`;
  for(let p=5;p>=1;p--){o+=`<text x="${ox-12}" y="${oy+(5-p)*ch+ch/2+4}" text-anchor="end" font-size="12" fill="#566259">${p}</text>`;
    for(let s=1;s<=5;s++){const R=p*s,c=HCOL[niv(R)],x=ox+(s-1)*cw,y=oy+(5-p)*ch,n=cnt[p+'-'+s]||0;
      o+=`<rect x="${x}" y="${y}" width="${cw-3}" height="${ch-3}" rx="5" fill="${c[0]}" stroke="${c[1]}" stroke-opacity=".4"/><text x="${x+7}" y="${y+14}" font-size="10" fill="${c[1]}">R=${R}</text><text x="${x+(cw-3)/2}" y="${y+36}" font-size="22" font-weight="bold" text-anchor="middle" fill="${c[1]}">${n||''}</text>`}}
  for(let s=1;s<=5;s++)o+=`<text x="${ox+(s-1)*cw+(cw-3)/2}" y="${oy+ch*5+14}" text-anchor="middle" font-size="12" fill="#566259">${s}</text>`;
  return o+`<text x="${ox+cw*2.5}" y="${oy+ch*5+36}" text-anchor="middle" font-size="10" font-weight="bold" fill="#16201b">SEVERIDAD</text></svg>`;
}
const _heatOld=heatSVG;
heatSVG=function(kind){const m=ipxActive();return m?heatIpx(kind,rowsOf(m.id)):_heatOld(kind)};
function zonaIpx(rows){
  const z={};rows.forEach(r=>{const c=calc(r),k=String(r.subproceso||r.proceso||'').trim()||'Sin zona',a=z[k]=z[k]||{n:0,i:0,v:0,si:0,sv:0};a.n++;a.i=Math.max(a.i,c.AB);a.v=Math.max(a.v,c.AP);if(c.AD==='Si')a.si++;if(c.AR==='Si')a.sv++});
  const zl=Object.entries(z).sort((a,b)=>b[1].i-a[1].i);
  if(!zl.length)return '<p class="mut">Sin peligros evaluados.</p>';
  const chip=n=>`<span style="background:#${LVC[niv(n)]};color:#000;padding:1px 9px;border-radius:5px;font-weight:700">${n}</span> <span class="mut">${niv(n)}</span>`;
  return `<div class="tw"><table style="min-width:560px"><thead><tr><th>Zona</th><th class="num">Peligros</th><th>Máx. inicial</th><th>Máx. vigente</th><th class="num">Significativos (inicial → residual)</th></tr></thead><tbody>${zl.map(([k,a])=>`<tr><td><b>${esc(k)}</b></td><td class="num">${a.n}</td><td>${chip(a.i)}</td><td>${chip(a.v)}</td><td class="num">${a.si} → ${a.sv}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ====== v15 · MULTIUSUARIO + GOOGLE DRIVE ======
   - Los datos se guardan en una carpeta de Google Drive ("Gestión de Residuos"): datos_residuos.json + archivos/ (fotos y documentos).
   - Quien crea el espacio es el ADMINISTRADOR. Solo entra quien él autorice: la app comparte la carpeta de Drive con cada correo
     (Editor = puede cambiar datos · Lector = solo ve). Google impide el acceso a cualquier otra cuenta.
   - NUNCA reemplaza lo existente: al conectar, une (merge) lo que hay en este navegador con lo que hay en Drive; gana el registro
     más reciente y no se borra nada. Antes de escribir se guarda un respaldo diario en Drive (carpeta respaldos/).
   - Reutiliza el motor de sincronización v13 (mismas reglas de unión, borrados y archivos). */
if(LOCAL)(()=>{
const GD_CID='';                       /* opcional: pega aquí tu ID de cliente OAuth para no escribirlo en cada equipo */
const FOLDER_NAME='Gestión de Residuos',FOLDER_MIME='application/vnd.google-apps.folder';
const SCOPE='https://www.googleapis.com/auth/drive';
const API='https://www.googleapis.com/drive/v3',UP='https://www.googleapis.com/upload/drive/v3';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}return null};
const G={cid:GD_CID||ls('gd-client')||(new URLSearchParams(location.search).get('gd'))||'',tok:'',exp:0,email:'',nombre:'',rol:'',folder:'',admin:'',users:[],st:'off',msg:'',ro:false,dirs:{},bk:false};
if(G.cid&&!ls('gd-client'))ls('gd-client',G.cid);
const ui=()=>{if(view==='gdr')render();else chip&&chip();gateUpd()};
const nf=()=>Object.assign(new Error('no existe'),{name:'NotFoundError'});

/* ---------- autenticación (Google Identity Services) ---------- */
function auth(prompt){return new Promise(async(ok,no)=>{try{await loadJS('https://accounts.google.com/gsi/client')}catch(e){return no(new Error('No se pudo cargar Google (¿sin internet?)'))}
  if(!G.cid)return no(new Error('Falta el ID de cliente de Google'));
  if(!G.tc||G.tcId!==G.cid){G.tcId=G.cid;G.tc=google.accounts.oauth2.initTokenClient({client_id:G.cid,scope:SCOPE,
    callback:r=>{if(r.error)return G.cb&&G.cb.no(new Error(r.error_description||r.error));G.tok=r.access_token;G.exp=Date.now()+(r.expires_in-90)*1000;G.cb&&G.cb.ok(G.tok)},
    error_callback:e=>G.cb&&G.cb.no(new Error('Inicio de sesión cancelado o bloqueado ('+(e.type||'error')+')'))})}
  G.cb={ok,no};G.tc.requestAccessToken({prompt,login_hint:G.email||undefined})})}
const token=async()=>G.tok&&Date.now()<G.exp?G.tok:auth('');
async function gf(url,opt={},raw){let t=await token();const h=()=>({...(opt.headers||{}),Authorization:'Bearer '+t});let r=await fetch(url,{...opt,headers:h()});
  if(r.status===401){G.tok='';t=await token();r=await fetch(url,{...opt,headers:h()})}
  if(!r.ok){let d='';try{d=(await r.clone().json()).error.message}catch(_){}const e=new Error(r.status===403?'Sin permiso en Drive'+(d?': '+d:''):'Drive '+r.status+(d?': '+d:''));e.status=r.status;throw e}
  return raw?r:(r.status===204?null:r.json())}
const Q=encodeURIComponent,esq=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function list(parent){const out=[];let pt='';do{const r=await gf(`${API}/files?q=${Q(`'${parent}' in parents and trashed=false`)}&fields=nextPageToken,files(id,name,mimeType,modifiedTime)&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true${pt?'&pageToken='+pt:''}`);out.push(...r.files);pt=r.nextPageToken||''}while(pt);return out}
async function upload(id,name,parent,body,mime){
  const url=`${UP}/files${id?'/'+id:''}?uploadType=resumable&supportsAllDrives=true&fields=id,name,modifiedTime`;
  const r=await gf(url,{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':mime||'application/octet-stream'},body:JSON.stringify(id?{}:{name,parents:[parent]})},true);
  const loc=r.headers.get('Location');if(!loc)throw new Error('Drive no devolvió la dirección de subida');
  const u=await fetch(loc,{method:'PUT',headers:{'Content-Type':mime||'application/octet-stream'},body});if(!u.ok)throw new Error('Drive '+u.status);return u.json()}
const mkdir=(name,parent)=>gf(`${API}/files?supportsAllDrives=true&fields=id,name,modifiedTime`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:FOLDER_MIME,parents:[parent]})});

/* ---------- carpeta de Drive vista como carpeta local (para el motor v13) ---------- */
function dirOf(fid){
  const D=G.dirs[fid]||(G.dirs[fid]={cache:new Map(),at:0,meta:new Map()});
  const find=async n=>{if(!D.cache.has(n)||Date.now()-D.at>45000){const l=await list(fid);D.cache=new Map(l.map(f=>[f.name,f]));D.at=Date.now()}return D.cache.get(n)};
  return{
    async getDirectoryHandle(n,o){let f=await find(n);if(!f){if(!(o&&o.create))throw nf();f=await mkdir(n,fid);D.cache.set(n,f)}return dirOf(f.id)},
    async getFileHandle(n,o){let f=await find(n);if(!f&&!(o&&o.create))throw nf();
      const isData=n==='datos_residuos.json';
      return{
        async getFile(){if(!f)throw nf();let m=D.meta.get(f.id);if(!m||Date.now()-m.at>10000){const r=await gf(`${API}/files/${f.id}?fields=modifiedTime&supportsAllDrives=true`);m={t:Date.parse(r.modifiedTime),at:Date.now()};D.meta.set(f.id,m)}
          const dl=()=>gf(`${API}/files/${f.id}?alt=media&supportsAllDrives=true`,{},true);
          if(isData)return{lastModified:m.t,text:async()=>(await dl()).text()};
          const b=await(await dl()).blob();return new File([b],n,{lastModified:m.t})},
        async createWritable(){const parts=[];return{async write(d){parts.push(d)},async close(){
          if(G.ro)return;
          const body=parts.length===1?parts[0]:new Blob(parts);
          if(isData&&f&&!G.bk){G.bk=true;try{await backup(f)}catch(e){console.warn('respaldo',e)}}
          const r=await upload(f&&f.id,n,fid,body,isData?'application/json':(body.type||'application/octet-stream'));
          f=r;D.cache.set(n,r);D.meta.delete(r.id)}}}}}};
}
async function backup(f){const root=G.folder,d=new Date().toISOString().slice(0,10),nm='datos_'+d+'.json';
  const rd=await dirOf(root).getDirectoryHandle('respaldos',{create:true});let ex=true;await rd.getFileHandle(nm).catch(()=>{ex=false});if(ex)return;
  await gf(`${API}/files/${f.id}/copy?supportsAllDrives=true&fields=id`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,parents:[(await find2(root,'respaldos')).id]})})}
async function find2(parent,name){return(await list(parent)).find(x=>x.name===name)}

/* ---------- usuarios y roles ---------- */
const lc=s=>String(s||'').trim().toLowerCase();
async function readJSON(parent,name){const f=await find2(parent,name);if(!f)return null;return{f,d:await(await gf(`${API}/files/${f.id}?alt=media&supportsAllDrives=true`,{},true)).json()}}
async function writeUsers(){const meta={v:1,admin:G.admin,usuarios:G.users,t:Date.now()};const f=await find2(G.folder,'usuarios.json');await upload(f&&f.id,'usuarios.json',G.folder,JSON.stringify(meta),'application/json')}
const ROLE={editor:'writer',lector:'reader'};
async function perms(){return(await gf(`${API}/files/${G.folder}/permissions?fields=permissions(id,emailAddress,role,type)&supportsAllDrives=true`)).permissions||[]}
async function addUser(email,rol){email=lc(email);if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))throw new Error('Correo no válido');if(email===lc(G.admin))throw new Error('Ese correo es el administrador');
  const ps=await perms(),p=ps.find(x=>lc(x.emailAddress)===email);
  if(p)await gf(`${API}/files/${G.folder}/permissions/${p.id}?supportsAllDrives=true`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:ROLE[rol]})});
  else await gf(`${API}/files/${G.folder}/permissions?sendNotificationEmail=true&supportsAllDrives=true`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'user',role:ROLE[rol],emailAddress:email})});
  G.users=G.users.filter(u=>lc(u.email)!==email).concat({email,rol});await writeUsers()}
async function delUser(email){email=lc(email);const p=(await perms()).find(x=>lc(x.emailAddress)===email);if(p&&p.role!=='owner')await gf(`${API}/files/${G.folder}/permissions/${p.id}?supportsAllDrives=true`,{method:'DELETE'});
  G.users=G.users.filter(u=>lc(u.email)!==email);await writeUsers()}

/* ---------- conectar ---------- */
async function connect(interactive){
  G.st='wait';G.msg='Conectando con Google…';ui();
  try{
    await auth(interactive?'select_account':'');
    const me=(await gf(`${API}/about?fields=user(emailAddress,displayName)`)).user;G.email=lc(me.emailAddress);G.nombre=me.displayName||'';ls('gd-email',G.email);
    let fid=ls('gd-folder');let ok=false;
    if(fid){try{const r=await gf(`${API}/files/${fid}?fields=id,trashed,mimeType&supportsAllDrives=true`);ok=!r.trashed&&r.mimeType===FOLDER_MIME}catch(e){ok=false}}
    if(!ok){const r=await gf(`${API}/files?q=${Q(`name='${esq(FOLDER_NAME)}' and mimeType='${FOLDER_MIME}' and trashed=false`)}&fields=files(id,name,owners(emailAddress))&supportsAllDrives=true&includeItemsFromAllDrives=true`);fid=r.files[0]&&r.files[0].id||''}
    if(!fid){G.st='nospace';G.msg='';ui();return}
    G.folder=fid;ls('gd-folder',fid);await enter();
  }catch(e){if(interactive){G.st='err';G.msg=e.message||'No se pudo conectar'}else{G.st='off';toast('Sesión de Google caducada: entra a “Google Drive” y pulsa Conectar')}ui()}
}
async function createSpace(){
  try{G.st='wait';G.msg='Creando tu espacio en Drive…';ui();
    const f=await mkdir(FOLDER_NAME,'root');G.folder=f.id;ls('gd-folder',f.id);G.admin=G.email;G.users=[];await writeUsers();await enter()}
  catch(e){G.st='err';G.msg=e.message;ui()}}
async function enter(){
  const u=await readJSON(G.folder,'usuarios.json');
  if(!u){ // carpeta sin usuarios.json: solo continúa quien es dueño de la carpeta
    const r=await gf(`${API}/files/${G.folder}?fields=ownedByMe&supportsAllDrives=true`);if(!r.ownedByMe){G.st='denied';G.msg='La carpeta de Drive no tiene configuración de usuarios. Pide al administrador que la abra primero.';ui();return}
    G.admin=G.email;G.users=[];await writeUsers()}
  else{G.admin=u.d.admin||'';G.users=u.d.usuarios||[]}
  const me=G.email;G.rol=lc(G.admin)===me?'admin':((G.users.find(x=>lc(x.email)===me)||{}).rol||'');
  if(!G.rol){G.st='denied';G.msg='Tu cuenta ('+me+') no está autorizada. Pide al administrador que te agregue.';DIR=null;ui();return}
  G.ro=G.rol==='lector';canWrite=!G.ro;
  DIR=dirOf(G.folder);G.bk=false;ls('gd-on','1');G.st='on';G.msg='';
  await dirSync();SYNC.err&&(G.msg='Aviso: '+SYNC.err);ui();render();
  clearInterval(G.vt);G.vt=setInterval(verify,20000);
}
function disconnect(){DIR=null;clearInterval(G.vt);G.st='off';G.rol='';G.ro=false;canWrite=true;ls('gd-on',null);try{G.tok&&google.accounts.oauth2.revoke(G.tok)}catch(e){}G.tok='';ui();render()}
/* Si este equipo tiene cambios más nuevos que los de Drive (p. ej. otro usuario escribió a la vez), vuelve a subirlos */
async function verify(){if(!DIR||busy||G.ro||document.hidden)return;
  try{const f=await DIR.getFileHandle('datos_residuos.json').catch(()=>null);if(!f)return;const file=await f.getFile();if(file.lastModified===G.vm)return;G.vm=file.lastModified;
    const d=JSON.parse(await file.text()),rem={};Object.entries(d.recs||{}).forEach(([c,a])=>a.forEach(r=>rem[c+'|'+r.id]=rmod(r)));
    let need=false;for(const c of Object.keys(S)){for(const r of S[c]){const k=c+'|'+r.id;if(!(k in rem)||rmod(r)>rem[k]){need=true;break}}if(need)break}
    if(need)dirSync()}catch(e){}}

    <p style="margin:0 0 10px"><b>Si eres el administrador</b>: créalo ahora. Se sube a tu Drive todo lo que tienes en esta aplicación (sin borrar nada).<br><b>Si te invitaron</b>: pide al administrador que te agregue con este correo y luego pulsa Reintentar.</p>

  if(G.st==='denied')return head+`<section class="panel card"><p style="margin:0 0 10px;color:var(--bad)"><b>${esc(G.msg)}</b></p><div class="gd-row"><button class="btn" data-gd="connect">Reintentar</button><button class="btn sm" data-gd="out">Cerrar sesión</button></div></section>`;
  const adm=G.rol==='admin';
  return head+`<div class="gd-g">
  <section class="panel card"><h2>Estado</h2>
    <p style="margin:0 0 6px"><span class="pill ok">● Conectado</span> &nbsp;<b>${esc(G.nombre||G.email)}</b> · ${esc(G.email)} · <b>${roleName(G.rol)}</b>${G.ro?' (solo ver)':''}</p>
    <p class="mut" style="margin:0 0 10px">${SYNC.t?'Última sincronización: '+esc(SYNC.t):'Sin sincronizar aún'}${SYNC.err?` · <span style="color:var(--bad)">${esc(SYNC.err)}</span>`:''}${G.msg?' · '+esc(G.msg):''}</p>
    <div class="gd-row"><button class="btn pri" data-gd="sync">Sincronizar ahora</button>
    <a class="btn" target="_blank" rel="noopener" href="https://drive.google.com/drive/folders/${esc(G.folder)}">Abrir carpeta en Drive</a><button class="btn sm" data-gd="out">Desconectar</button></div>
    <p class="mut" style="margin:10px 0 0;font-size:13px">Guarda en Drive: <code>datos_residuos.json</code> (toda la información), <code>archivos/</code> (fotos y documentos) y <code>respaldos/</code> (una copia por día antes de escribir). Los cambios de otras personas llegan solos en unos segundos.</p></section>
  ${adm?`<section class="panel card"><h2>Usuarios autorizados</h2>
    <p class="mut" style="margin:0 0 10px">Solo las cuentas de Google de esta lista pueden entrar. Al agregarlas se comparte la carpeta de Drive con ellas (Google les envía un aviso); al quitarlas se les retira el acceso.</p>
    <table class="gd-u"><thead><tr><th>Correo</th><th>Rol</th><th></th></tr></thead><tbody>
      <tr><td>${esc(G.admin)}</td><td>Administrador</td><td></td></tr>
      ${G.users.map(u=>`<tr><td>${esc(u.email)}</td><td><select data-gdrol="${esc(u.email)}"><option value="editor" ${u.rol==='editor'?'selected':''}>Editor (puede modificar)</option><option value="lector" ${u.rol==='lector'?'selected':''}>Lector (solo ver)</option></select></td><td><button class="btn sm danger" data-gd="deluser:${esc(u.email)}">Quitar</button></td></tr>`).join('')}
    </tbody></table>
    <div class="gd-row" style="margin-top:12px"><input id="gd-new" type="email" placeholder="correo@gmail.com" style="flex:1 1 240px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px">
      <select id="gd-newrol" style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px"><option value="editor">Editor</option><option value="lector">Lector</option></select><button class="btn pri" data-gd="adduser">Agregar</button></div></section>`:''}
  <section class="panel card"><h2>Cómo se cuida lo existente</h2><p style="margin:0;line-height:1.6">Al conectar, la información de este equipo y la de Drive se <b>unen</b>: si un registro existe en ambos, se queda el más reciente; los que solo existen en un lado se agregan en el otro. Nada se reemplaza en bloque ni se borra por conectar. Cada día se guarda un respaldo en la carpeta <code>respaldos</code> de Drive.</p></section></div>`;
};
document.addEventListener('click',async e=>{const a=e.target.closest('[data-gd]');if(!a)return;const[act,arg]=a.dataset.gd.split(/:(.*)/s);
  try{
    if(act==='savecid'){const v=($('#gd-cid').value||'').trim();if(!/\.apps\.googleusercontent\.com$/.test(v)){toast('El ID de cliente debe terminar en .apps.googleusercontent.com');return}G.cid=v;ls('gd-client',v);G.st='off';G.tc=null;render()}
    else if(act==='cfg'){G.st='cfg';render()}
    else if(act==='connect')connect(true);
    else if(act==='create')createSpace();
    else if(act==='out')disconnect();
    else if(act==='sync'){toast('Sincronizando…');await dirSync();ui();toast(SYNC.err?'Aviso: '+SYNC.err:'Sincronizado')}
    else if(act==='adduser'){const em=$('#gd-new').value,rol=$('#gd-newrol').value;await addUser(em,rol);toast('Usuario agregado y carpeta compartida');render()}
    else if(act==='deluser'){confirmBox('¿Quitar el acceso de '+esc(arg)+'?',async()=>{await delUser(arg);render()})}
  }catch(err){toast(err.message||'No se pudo completar')}});
document.addEventListener('change',async e=>{const s=e.target;if(!s.dataset||!s.dataset.gdrol)return;try{await addUser(s.dataset.gdrol,s.value);toast('Rol actualizado')}catch(err){toast(err.message);render()}});

const _gr=render;render=function(){_gr();gateUpd();const s=document.querySelector('#nav button[data-go="gdr"]');if(s&&G.st==='on'&&!s.querySelector('.gdok'))s.insertAdjacentHTML('beforeend','<span class="n gdok" title="Conectado a Google Drive" style="color:#5cc6a2">●</span>')};
const _chip=chip;chip=function(){_chip();const b=document.getElementById('v13-chip');if(b&&G.st==='on'){b.textContent='● Drive · '+(SYNC.t||'conectado')+(G.ro?' · solo ver':'');b.title='Conectado a Google Drive como '+G.email}};
document.addEventListener('click',e=>{if(G.st==='on'&&e.target.closest('[data-act="v13dir"]')){e.stopImmediatePropagation();e.preventDefault();go('gdr')}},true);
/* ---------- pantalla de ingreso: INICIAR SESIÓN CON GOOGLE ---------- */
const gst=document.createElement('style');gst.textContent=`#gd-gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
#gd-gate .gbox{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.18);padding:28px 24px;display:grid;gap:14px;text-align:center}
#gd-gate h1{font-size:30px}#gd-gate p{margin:0;color:var(--muted)}#gd-gate .gl{display:flex;justify-content:center}
#gd-gate .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:6px;padding:11px 18px;font-weight:600;cursor:pointer;font-size:15px;min-height:44px}
#gd-gate .gbtn:hover{background:#f6f8fc}#gd-gate .gbtn[disabled]{opacity:.6;cursor:default}
#gd-gate .gerr{color:var(--bad);font-weight:600}#gd-gate input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;text-align:left}
#gd-gate .gsk{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}`;document.head.appendChild(gst);
const GLOGO='<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 019.5 24c0-1.6.3-3.2.9-4.7l-7.9-6.1A24 24 0 000 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
let SKIP=false;try{SKIP=sessionStorage.getItem('gd-skip')==='1'}catch(e){}
function gateUpd(){
  let g=document.getElementById('gd-gate');
  if(G.st==='on'||SKIP){if(g)g.remove();return}
  if(!g){g=document.createElement('div');g.id='gd-gate';document.body.insertBefore(g,document.body.firstChild)}
  const bad=location.protocol==='file:',brand='<div class="gl"><svg width="46" height="46" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#f0b429"/><path d="M17 6l11 19H6z" fill="none" stroke="#13201a" stroke-width="2.4" stroke-linejoin="round"/><path d="M17 13v6" stroke="#13201a" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="22" r="1.4" fill="#13201a"/></svg></div><h1>Gestión de Residuos</h1>';
  const sk=(!G.cid||G.st==='err'||G.st==='cfg')?'<button class="gsk" data-gd="skip">Continuar sin iniciar sesión (solo en este equipo)</button>':'';
  let b='';
  if(G.st==='wait')b=`${brand}<p><b>${esc(G.msg||'Un momento…')}</b></p>`;
  else if(!G.cid||G.st==='cfg')b=`${brand}<p>Para iniciar sesión con Google, pega una sola vez el <b>ID de cliente OAuth</b> de tu proyecto de Google Cloud (Google Drive API activada; origen autorizado: <b>${esc(location.origin==='null'?'tu dirección https':location.origin)}</b>).</p>${bad?'<p class="gerr">Esta página está abierta como archivo (file://). Google no permite iniciar sesión así: ábrela desde una dirección https o http://localhost.</p>':''}<input id="gd-cid" placeholder="123456-abc.apps.googleusercontent.com" value="${esc(G.cid)}"><button class="gbtn" data-gd="savecid">Guardar ID de cliente</button>${sk}`;
  else if(G.st==='nospace')b=`${brand}<p>Sesión iniciada como <b>${esc(G.email)}</b>. No hay un espacio “${FOLDER_NAME}” visible para esta cuenta.</p><p>Administrador: créalo ahora (se sube lo que ya tienes, sin borrar nada). Invitado: pide al administrador que te agregue y reintenta.</p><button class="gbtn" data-gd="create">Crear mi espacio y ser administrador</button><button class="gbtn" data-gd="connect">Reintentar</button><button class="gsk" data-gd="out">Cerrar sesión</button>`;
  else if(G.st==='denied')b=`${brand}<p class="gerr">${esc(G.msg)}</p><button class="gbtn" data-gd="connect">${GLOGO} Probar con otra cuenta</button><button class="gsk" data-gd="out">Cerrar sesión</button>`;
  else b=`${brand}<p>Inicia sesión con tu cuenta de Google para entrar. Solo pueden entrar las cuentas autorizadas por el administrador.</p>${G.st==='err'?`<p class="gerr">${esc(G.msg)}</p>`:''}${bad?'<p class="gerr">Estás en un archivo local (file://): Google bloqueará el inicio de sesión. Usa una dirección https o localhost.</p>':''}<button class="gbtn" data-gd="connect">${GLOGO} Iniciar sesión con Google</button><button class="gsk" data-gd="cfg">Cambiar ID de cliente</button>${sk}`;
  g.innerHTML=`<div class="gbox">${b}</div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-gd="skip"]');if(!a)return;SKIP=true;try{sessionStorage.setItem('gd-skip','1')}catch(_){}gateUpd()});
if(G.cid&&ls('gd-on')){G.st='wait';G.msg='Verificando tu sesión de Google…'}
gateUpd();
/* reconexión silenciosa si ya había iniciado sesión antes */
if(G.cid&&ls('gd-on')){window.addEventListener('load',()=>setTimeout(async()=>{try{G.email=ls('gd-email')||'';await window.READY;await connect(false)}catch(e){}},1200))}
})();

render();boot();
