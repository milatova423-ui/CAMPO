<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de Residuos Peligrosos</title>
<style>
:root{--bg:#f6f7f5;--fg:#1d2420;--card:#fff;--ac:#2f6b3f;--bd:#d9ddd8;--mut:#667}
@media(prefers-color-scheme:dark){:root{--bg:#161a17;--fg:#e8ece9;--card:#202622;--ac:#6fbf84;--bd:#34403a;--mut:#9aa}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
nav{background:var(--ac);padding:.6rem 1rem;display:flex;gap:1rem;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;font-weight:600}main{max-width:1200px;margin:1rem auto;padding:0 1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:1rem;margin-bottom:1rem}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:.4rem .6rem;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:.8rem;text-transform:uppercase;color:var(--mut)}
.btn,button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:.45rem .9rem;cursor:pointer;text-decoration:none;font-size:14px;display:inline-block}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}.btn.del{background:#b3261e}
input,select,textarea{width:100%;padding:.45rem;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem}label{font-size:.85rem;color:var(--mut)}
.flash{padding:.6rem 1rem;border-radius:6px;margin-bottom:1rem}.flash.ok{background:#d8efdd;color:#134}.flash.err{background:#f8d7d4;color:#600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8rem}.gal img{width:100%;height:140px;object-fit:cover;border-radius:6px}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.stat{font-size:1.8rem;font-weight:700;color:var(--ac)}
</style></head><body>
<nav><a href="{{ url_for('dashboard') }}">Panel</a>
{% for k,e in ENTIDADES.items() %}<a href="{{ url_for('listado',k=k) }}">{{ e.titulo }}</a>{% endfor %}</nav>
<main>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{c}}">{{m}}</div>{% endfor %}
{% block body %}{% endblock %}</main></body></html>
